name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Check formatting
        run: yarn format

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Build deployment image
        run: docker build --tag limopti:ci .

      - name: Smoke test deployment command loader
        run: |
          docker run --rm \
            --entrypoint node \
            --env NODE_ENV=production \
            --env HOST=0.0.0.0 \
            --env PORT=3333 \
            --env LOG_LEVEL=info \
            --env APP_KEY=limopti-ci-runtime-key \
            --env APP_URL=http://localhost:3333 \
            --env DATABASE_URL=postgres://app:app@localhost:5432/limopti \
            --env SESSION_DRIVER=cookie \
            limopti:ci ace list
